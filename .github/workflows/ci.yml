name: Application quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Lint, unit tests, build, docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test gameplay, cloud boundaries, and event contracts
        run: |
          mkdir -p artifacts
          npm test -- --reporter=default --reporter=json --outputFile=artifacts/vitest.json
      - name: Build production bundle
        run: npm run build
      - name: Check documentation consistency
        run: npm run check:docs
      - name: Retain test-case evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: artifacts/vitest.json
          if-no-files-found: warn
          retention-days: 30

  browser:
    name: Desktop and mobile browser smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile with controlled service responses
        run: npm run test:e2e
      - name: Retain browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
